kind: Changed
body: |-
    **View decoders share one tag loop; repeated messages decode in place.** `MessageView::merge_into_view` now runs a single type-erased loop instead of one instantiation per view type (and per parent arm it was inlined into); `decode_view_ctx` (the top-level entry) and views with at most four singular fields keep a monomorphic `#[inline]` loop, mirroring the owned side. Repeated message and group fields, owned (default `Vec`) and view, decode elements larger than 128 bytes straight into the pushed `Vec` slot instead of building them on the stack and moving them into the collection; smaller elements keep the stack temporary, which decodes in registers. The choice is a `size_of` comparison the compiler folds, so only one path is emitted per field, and the element-memory budget is charged before anything is pushed.
