kind: Changed
body: |-
    **View decoders share one tag loop.** `MessageView::merge_into_view` now runs a single type-erased loop instead of one instantiation per view type (and per parent arm it was inlined into); `decode_view_ctx` (the top-level entry) and views with at most four singular fields keep a monomorphic `#[inline]` loop, mirroring the owned side.
