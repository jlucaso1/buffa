kind: Breaking changes
body: |-
    **Smaller generated code: type-erased decode loops.** `Message::merge_to_limit`, `merge_group` and `merge_length_delimited` now run one shared loop per buffer type instead of one per (message, buffer) pair. The per-message `merge_field` dispatch is the only monomorphised decode code; the loop prologue, length-prefix checks and error-propagation tails no longer repeat in every message and in every parent arm that inlined a sub-decoder. Messages with at most four singular fields keep monomorphic `#[inline]` loops via generated overrides, so tiny sub-messages still inline into their parent's arm; a small message with a string or bytes field is not tiny, because that field's per-occurrence allocation and validation dwarf the shared loop's indirect call and the override would buy nothing there. The breaking part is for hand-written `Message` impls only: because the shared loop is entered directly, the default `merge_length_delimited` and `merge_group` no longer dispatch through a `merge_to_limit` override, so an implementation that overrides the loop must override all three. Generated code and callers are unaffected. The top-level entry points (`merge`, `decode`, `decode_length_delimited`, `DecodeOptions`) dispatch through `merge_to_limit`, which generated code overrides with a monomorphic loop, so a message an application decodes directly pays no indirect call and a hand-written override of `merge_to_limit` applies there; only nested sub-messages go through the shared loop. On a 750-message schema (`whatsapp.proto`) at `opt-level = "z"` with fat LTO, with every message also decoded at top level, this removes 25% of owned-codec `.text` (382 KiB of 1.51 MiB) and 28% with views included (together with the other decoder and encoder changes in this release). No signature changes.
time: 2026-09-03T12:00:00.000000-03:00
