kind: Breaking changes
body: |-
    **Smaller generated code: type-erased decode loops.** `Message::merge_to_limit`, `merge_group` and `merge_length_delimited` now run one shared loop per buffer type instead of one per (message, buffer) pair. The per-message `merge_field` dispatch is the only monomorphised decode code; the loop prologue, length-prefix checks and error-propagation tails no longer repeat in every message and in every parent arm that inlined a sub-decoder. Messages with at most four singular fields keep monomorphic `#[inline]` loops via generated overrides, so tiny sub-messages still inline into their parent's arm. The breaking part is for hand-written `Message` impls only: because the shared loop is entered directly, the default `merge_length_delimited` and `merge_group` no longer dispatch through a `merge_to_limit` override, so an implementation that overrides the loop must override all three. Generated code and callers are unaffected. The top-level entry points (`merge`, `decode`, `decode_length_delimited`, `DecodeOptions`) keep a monomorphic loop, so a message an application decodes directly pays no indirect call; only nested sub-messages go through the shared loop. On a 750-message schema (`whatsapp.proto`) at `opt-level = "z"` with fat LTO, with every message also decoded at top level, this removes 13% of owned-codec `.text` (206 KiB of 1.53 MiB) and 18% with views included. No signature changes.
