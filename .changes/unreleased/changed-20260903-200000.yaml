kind: Changed
body: |-
    **Decode arms call one fused reader per field kind.** Generated `merge_field` arms for singular numeric, bool, `string` and `bytes` fields now call `buffa::types::merge_<type>_field` (or the `merge_opt_<type>_field` sibling for explicit presence), and repeated `string` / `bytes` fields in the default `Vec` call `push_string_field` / `push_bytes_field`, which charge the element-memory budget before the element is pushed. Each reader does the wire-type check, the decode and the store in one function instead of the arm spelling the steps out. At `opt-level = "z"`, where the inliner takes almost nothing, that turns each arm into one call; at `opt-level = 3` the `#[inline]` readers inline back to the spelled-out form. View arms use the same numeric readers and `borrow_*_field` for strings and bytes. The readers are public so hand-written `Message` impls can use them too.
time: 2026-09-03T20:00:00.000000-03:00
