kind: Breaking changes
body: |-
    **View sub-message fields without cycles are stored inline.** Singular message/group view fields whose type cannot form a reference cycle (the same `inlined_message_fields` predicate that gates owned `Inline` storage) are now `InlineMessageFieldView<V>` (`Option<V>`) instead of `MessageFieldView<V>` (`Option<Box<V>>`), so decoding a set field performs no heap allocation. Recursive fields (including self-referential ones, which never clear the cycle check), oneof variants, repeated elements and map values keep their existing storage. The two wrappers share the full method surface (`is_set`, `as_option`, `get_or_insert_default`, deref-to-default, wire-equivalent equality, view encode), so decode, `to_owned`, serde, reflect and text paths are unchanged; only the declared field type in generated view structs (and owned-view accessors) differs. Regenerate downstream code: any crate matching on or naming the old field type will fail to compile until regenerated.
time: 2026-09-04T17:00:00.000000-03:00
