kind: Changed
body: |-
    **Field writers share four tag+payload primitives.** `types::put_<type>_field`, `put_len_delimited_header`, `put_submessage_header` and (on contiguous sinks) `put_shared_bytes_field` now fold the literal field number into a constant tag and call one of the new `put_tagged_varint` / `put_tagged_fixed32` / `put_tagged_fixed64` / `put_tagged_len_delimited` primitives. The tag store inlines to constant byte(s) at any opt level; the loop-y payload halves (`put_varint_payload`, `put_len_prefixed`) are `#[inline(never)]` and shared one-per-sink, so a speed-optimised build no longer duplicates the varint loop and sink-grow stubs into every arm of wide messages (`write_to` of a 90-field message shrinks ~24% versus fully inlining them, which cost ~30% code growth and a 6–14% encode slowdown on wide unions). A size-optimised build keeps one call per field instead of one for the tag and one for the payload (−4.8% owned-codec `.text` on a 750-message schema). The primitives are public for hand-written encoders.
time: 2026-09-03T21:00:00.000000-03:00
