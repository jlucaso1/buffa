kind: Changed
body: |-
    **Smaller generated code: type-erased decode loops.** `Message::merge_to_limit`, `merge_group` and `merge_length_delimited` now run one shared loop per buffer type instead of one per (message, buffer) pair. The per-message `merge_field` dispatch is the only monomorphised decode code; the loop prologue, length-prefix checks and error-propagation tails no longer repeat in every message and in every parent arm that inlined a sub-decoder. On a 750-message schema (`whatsapp.proto`) at `opt-level = "z"` with fat LTO this removes 13% of `.text` (215 KiB of 1.57 MiB). The three provided methods gain a `where Self: Sized` bound (the trait was never object-safe, so nothing observable changes).
time: 2026-09-03T12:00:00.000000-03:00
